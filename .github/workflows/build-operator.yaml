name: Build, Push and Deploy Operator

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
  
    - name: Checkout code
      uses: actions/checkout@v3


    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.23
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v1
      with:
        version: 'latest'

    
    - name: Increment version
      id: version
      run: |
        # Extract the current version from a VERSION file or default to 0.1.0
        if [ -f VERSION ]; then
          version=$(cat VERSION)
        else
          version="0.5.0"
        fi

        # Increment the patch version
        IFS='.' read -r major minor patch <<< "$version"
        patch=$((patch + 1))
        new_version="$major.$minor.$patch"

        # Save the new version
        echo "$new_version" > VERSION
        echo "new_version=$new_version" >> $GITHUB_ENV
        echo "version=$version" >> $GITHUB_ENV

    
    - name: Commit updated version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add VERSION
        git commit -m "Increment version to ${{ env.new_version }}"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}

   
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        cd operator
        make docker-build IMG=${{ secrets.DOCKER_USERNAME }}/operator:${{ env.new_version }}
        docker push ${{ secrets.DOCKER_USERNAME }}/operator:${{ env.new_version }}

  package-crds:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Package CRDs and make them available in Github Releases
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OPERATOR_NAME: "AI-KSA Operator" 
        OPERATOR_DESCRIPTION: "An AI-powered Kubernetes operator for scaling workloads." 
        BUNDLE_CHANNELS: "stable" 
        BUNDLE_DEFAULT_CHANNEL: "stable" 
        OPERATOR_EMAIL: "rajaravindra919@gmail.com"
      run: |
        cd operator
        make bundle
        mkdir -p release
        tar -czvf release/ki-asagent-${{ env.new_version }}.tar.gz -C bundle .

        gh release create "v${{ env.new_version }}" ./release/ki-asagent-${{ env.new_version }}.tar.gz \
          --title "Release v${{ env.new_version }}" \
          --notes "This release includes the CRDs for version v${{ env.new_version }}."

  deploy-to-kubernetes:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Kubernetes
      env:
        KUBECONFIG: ${{ runner.temp }}/kubeconfig
      run: |
        echo "${{ secrets.KUBECONFIG }}" > $KUBECONFIG
        cd operator
        kubectl get ns
        make deploy IMG=${{ secrets.DOCKER_USERNAME }}/operator:${{ env.new_version }} AGENT_IMG=${{ secrets.DOCKER_USERNAME }}/agent:${{ env.new_version }}