name: Build and Push Operator

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Set up Go
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.23

    # Step 3: Extract the current version and increment it
    - name: Increment version
      id: version
      run: |
        # Extract the current version from a VERSION file or default to 0.1.0
        if [ -f VERSION ]; then
          version=$(cat VERSION)
        else
          version="0.5.0"
        fi

        # Increment the patch version
        IFS='.' read -r major minor patch <<< "$version"
        patch=$((patch + 1))
        new_version="$major.$minor.$patch"

        # Save the new version
        echo "$new_version" > VERSION
        echo "new_version=$new_version" >> $GITHUB_ENV

    # Step 4: Commit the updated version file
    - name: Commit updated version
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add VERSION
        git commit -m "Increment version to ${{ env.new_version }}"
        git push

    # Step 5: Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 6: Build and push the Docker image
# Step 6: Build and push the Docker image
    - name: Build and push Docker image
      run: |
        make docker-build IMG=${{ secrets.DOCKER_USERNAME }}/operator:${{ env.new_version }}
        docker push ${{ secrets.DOCKER_USERNAME }}/operator:${{ env.new_version }}