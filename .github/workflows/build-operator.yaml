name: Build, Push and Deploy Operator

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Job to set up the environment and increment the version
  setup:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.set_version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Increment version
        id: set_version
        run: |
          # Extract the current version from a VERSION file or default to 0.1.0
          if [ -f VERSION ]; then
            version=$(cat VERSION)
          else
            version="0.5.0"
          fi

          # Increment the patch version
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          new_version="$major.$minor.$patch"

          # Save the new version
          echo "$new_version" > VERSION
          echo "new_version=$new_version" >> $GITHUB_ENV
          echo "::set-output name=new_version::$new_version"

      - name: Commit updated version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Increment version to ${{ env.new_version }}"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}

  # Job to build and push the operator image
  build-operator:
    needs: setup
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      new_version: ${{ needs.setup.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image for operator
        run: |
          cd operator
          make docker-build IMG=${{ secrets.DOCKER_USERNAME }}/operator:${{ env.new_version }}
          docker push ${{ secrets.DOCKER_USERNAME }}/operator:${{ env.new_version }}
          docker tag ${{ secrets.DOCKER_USERNAME }}/operator:${{ env.new_version }} ${{ secrets.DOCKER_USERNAME }}/operator:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/operator:latest

  # Job to build and push the agent image
  build-agent:
    needs: setup
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      new_version: ${{ needs.setup.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image for agent
        run: |
          cd ai-agent
          docker build -t ${{ secrets.DOCKER_USERNAME }}/agent:${{ env.new_version }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/agent:${{ env.new_version }} ${{ secrets.DOCKER_USERNAME }}/agent:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/agent:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/agent:${{ env.new_version }}

  # Job to deploy to Kubernetes and create a release
  deploy-and-release:
    needs: [build-operator, build-agent, setup]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      new_version: ${{ needs.setup.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v1
        with:
          version: 'latest'

      - name: Deploy to Kubernetes and Package YAMLs for Release
        run: |
          echo "${{ secrets.KUBECONFIG }}" > $(pwd)/kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig

          cd operator
          make deploy IMG=${{ secrets.DOCKER_USERNAME }}/operator:${{ env.new_version }} AGENT_IMG=${{ secrets.DOCKER_USERNAME }}/agent:${{ env.new_version }}

          mkdir -p release
          cp config/agent.yaml release/aiksa-agent-${{ env.new_version }}.yaml

          # Upload the packaged YAMLs to GitHub Release
          gh release create "v${{ env.new_version }}" ./release/aiksa-agent-${{ env.new_version }}.yaml \
            --title "Release v${{ env.new_version }}" \
            --notes "This release includes the deployment YAMLs for version v${{ env.new_version }}. To install, run:\n\n \`\`\`bash \n kubectl apply -f https://github.com/KR-Ravindra/ai-ksa/releases/download/v${{ env.new_version }}/aiksa-agent-${{ env.new_version }}.yaml\n\`\`\`\n\nFor more details, visit [the documentation](https://github.com/KR-Ravindra/ai-ksa)."