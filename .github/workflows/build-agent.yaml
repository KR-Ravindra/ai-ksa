name: Build and Push Agent

on:
  push:
    branches:
      - main
    paths:
      - 'ai-agent/**'
      - 'VERSION'
  workflow_dispatch:


jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v3


    # Step 3: Extract the current version and increment it
    - name: Get version
      id: version
      run: |
        # Extract the current version from a VERSION file or default to 0.1.0
        if [ -f VERSION ]; then
          version=$(cat VERSION)
        else
          version="0.5.0"
        fi

    # Step 5: Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 6: Build and push the Docker image
    - name: Build and push Docker image
      run: |
        cd ai-agent
        docker build -t ${{ secrets.DOCKER_USERNAME }}/agent:${{ env.new_version }} .
        docker tag $${{ secrets.DOCKER_USERNAME }}/agent:${{ env.new_version }} ${{ secrets.DOCKER_USERNAME }}/agent:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/agent:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/agent:${{ env.new_version }}
