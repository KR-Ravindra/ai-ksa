name: Build and Push Agent

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-agent/**'
      - '.github/workflows/build-agent.yaml'
      - 'VERSION'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v3

    - name: sleep for 10 seconds
      run: sleep 10

    # Step 3: Extract the current version and increment it
    - name: Get version
      id: version
      run: |
        # Extract the current version from a VERSION file or default to 0.1.0
        if [ -f VERSION ]; then
          version=$(cat VERSION)
        else
          version="0.5.0"
        fi

        # Save the version
        echo "version=$version" >> $GITHUB_ENV
    # Step 5: Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 6: Build and push the Docker image
    - name: Build and push Docker image
      run: |
        cd ai-agent
        echo ${{ env.version }}
        docker build -t ${{ secrets.DOCKER_USERNAME }}/agent:${{ env.version }} .
        docker tag ${{ secrets.DOCKER_USERNAME }}/agent:${{ env.version }} ${{ secrets.DOCKER_USERNAME }}/agent:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/agent:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/agent:${{ env.version }}
