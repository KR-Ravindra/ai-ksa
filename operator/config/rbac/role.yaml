---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - autoscaling.cortex.me
  resources:
  - aihorizontalpodautoscalers
  - scheduledscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling.cortex.me
  resources:
  - aihorizontalpodautoscalers/finalizers
  - scheduledscalers/finalizers
  verbs:
  - update
- apiGroups:
  - autoscaling.cortex.me
  resources:
  - aihorizontalpodautoscalers/status
  - scheduledscalers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - cronjobs/finalizers
  verbs:
  - update
- apiGroups:
  - batch
  resources:
  - cronjobs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  - metrics.k8s.io
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
