# permissions for end users to edit aihorizontalpodautoscalers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
  name: aihorizontalpodautoscaler-editor-role
rules:
- apiGroups:
  - autoscaling.cortex.me
  resources:
  - aihorizontalpodautoscalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoscaling.cortex.me
  resources:
  - aihorizontalpodautoscalers/status
  verbs:
  - get
