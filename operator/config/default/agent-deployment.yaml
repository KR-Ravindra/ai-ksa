
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-scaling-agent
  namespace: system
  labels:
    app.kubernetes.io/name: ai-scaling-agent
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-scaling-agent
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: ai-scaling-agent
      labels:
        app.kubernetes.io/name: ai-scaling-agent
    spec:
      containers:
      - image: ai-scaling-agent
        name: ai-scaling-agent
        env:
        - name: HISTORY_LENGTH
          value: "10"
        - name: SCAN_INTERVAL
          value: "15"
        - name: SCALE_UP_THRESHOLD
          value: "800"
        - name: SCALE_DOWN_THRESHOLD
          value: "200"
        - name: MODEL_TYPE
          value: "arima"
        - name: CONSISTENCY_THRESHOLD
          value: "2"
        - name: AUTOSCALER_API_URL
          value: "http://controller-manager-autoscale-trigger:8080"
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10