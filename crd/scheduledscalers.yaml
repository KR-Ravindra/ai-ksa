apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scheduledscalers.autoscaling.cortex.me
spec:
  group: autoscaling.cortex.me
  names:
    kind: ScheduledScaler
    listKind: ScheduledScalerList
    plural: scheduledscalers
    singular: scheduledscaler
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetDeploymentName:
                  type: string
                targetDeploymentNamespace:
                  type: string
                schedule:
                  type: string
                  description: "Cron expression for scaling schedule"
                replicas:
                  type: int32
                  description: "Desired number of replicas"
