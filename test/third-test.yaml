apiVersion: autoscaling.cortex.me/v1
kind: ScheduledScaler
metadata:
  name: recurring-scaler
  namespace: default
spec:
  targetDeploymentName: nginx
  targetDeploymentNamespace: default
  schedule: "*/5 * * * *" # Every 5 minutes
  duration: 2            # Duration in minutes
  replicas: 5            # Number of replicas to scale up to
  endReplicas: 2         # Number of replicas to scale down to after the duration
  oneTime: false         # Indicates this is a recurring scaling event