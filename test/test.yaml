apiVersion: autoscaling.cortex.me/v1 # Make sure this matches your CRD
kind: AIHorizontalPodAutoscaler
metadata:
  name: my-test-autoscaler # Give it a unique name
  namespace: default # Or the namespace where you want the Deployment
spec:
  targetDeploymentName: nginx # This won't be used in this simple version
  targetDeploymentNamespace: default # This won't be used
  targetDeploymentCPUThreshold: 60 # These won't be used yet
