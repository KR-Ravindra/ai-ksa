apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-based
  labels:
    app: ai-based
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-based
  template:
    metadata:
      labels:
        app: ai-based
    spec:
      containers:
      - name: stress
        image: progrium/stress
        command: ["stress"]
        args: ["--cpu", "4", "--vm", "2", "--vm-bytes", "512M", "--timeout", "6000"]